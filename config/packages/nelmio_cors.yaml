nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin:
            - 'http://localhost:5173'
            - 'http://127.0.0.1:5173'
        forced_allow_origin_value: 'http://localhost:5173'
        allow_methods:
            - GET
            - OPTIONS
            - POST
            - PUT
            - PATCH
            - DELETE
        allow_headers:
            - Content-Type
            - Authorization
            - X-AUTH-TOKEN
        expose_headers:
            - Link
        max_age: 3600

    paths:
        '^/api/':
            origin_regex: false
            allow_origin:
                - 'http://localhost:5173'
                - 'http://127.0.0.1:5173'
            forced_allow_origin_value: 'http://localhost:5173'
            allow_methods:
                - GET
                - OPTIONS
                - POST
                - PUT
                - PATCH
                - DELETE
            allow_headers:
                - Content-Type
                - Authorization
                - X-AUTH-TOKEN
            max_age: 3600